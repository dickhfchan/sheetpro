# SheetPro command catalog: the measurable UI surface of the target spreadsheet app.
#
# One entry per user-visible action. `id` is stable and is the command id the engine must
# register for the item to count as "live" (see `cargo xtask parity`).
# Fields: id, label, loc (ribbon tab › group, backstage page, or "keyboard"), key (Windows-style
# shortcut; the shell maps Ctrl→Cmd on macOS), notes (behaviour, in our own words).
#
# Sources: public end-user documentation (ribbon layout, "Keyboard shortcuts in Excel" help
# page) and observation of the running app. Labels and notes are our own wording.


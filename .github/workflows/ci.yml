name: ci
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # The toolchain (and components) pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Fetch oracle corpus
        run: cargo xtask corpus
      - name: All gates
        run: cargo xtask check
